<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Pass Wallet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="/css/styleTail.css" rel="stylesheet">
    <style>
    @media (max-width: 600px) {
    .footer-bar {
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
        }
    }
    @media (min-width: 768px) {
    .table-wrapper {
        max-height: none;
        overflow-y: visible;
        }
    }
    </style>
    <script>
      const currentUrl = window.location.href;
      const baseOrigin = window.location.origin;
      let adresse='';
      let fullURL;
      let version;
      
      function toggleDarkMode() {
        document.documentElement.classList.toggle('dark');
      }
      function generateWallet() {
        let nom = document.getElementById('nom').value.trim();
        let type = document.getElementById('type').value.trim();
        let _texte = document.getElementById('code').value.trim();
        return {wallet:_texte, nom:nom, couleur: document.getElementById('color').value,type:type};
      }
      function generateUrl() {
//        const baseUrl = 'https://draft.e-coucou.com/api/qrcode/vcard?';
        const baseUrl = baseOrigin + '/api/qrcode/wallet?';
        const params = new URLSearchParams();
        
        const nom = document.getElementById('nom').value.trim();
        if (nom) params.append('nom', nom);
        const code = document.getElementById('code').value.trim();
        if (code) params.append('code', code);

        params.append('QUAL', document.getElementById('qual').value);
        params.append('LEVEL', document.getElementById('level').value);
        params.append('CONTRASTE', document.getElementById('contraste').checked ? '1' : '0');
        params.append('STANDARD', document.getElementById('standard').checked ? '1' : '0');
        params.append('COLOR', document.getElementById('color').value);

        fullUrl = baseUrl + params.toString() + '&PIXEL=10';
        document.getElementById('qrcodeText').value = fullUrl;
        saveFormToCookie();
      }
      function lauchURL() {
        const webURL = fullUrl+"&WEB=0";
        window.open(webURL, '_blank');
      }
      function GetImage() {
        const getPNG = fullUrl;
        window.open(getPNG, '_blank');
      }
      function fetchImage() {
        const getPNG = fullUrl + "&WEB=1";
        fetch(getPNG)
          .then(response => response.blob())
          .then(blob => {
            const imgUrl = URL.createObjectURL(blob);
            const img = document.getElementById('fetchedImage');
            img.src = imgUrl;
            img.classList.remove('hidden');
          })
          .catch(error => console.error('Erreur image :', error));
      }
      function addWallet() {
        const { wallet, nom, couleur, type } = generateWallet();
        fetch('/api/qrcode/get_wallet', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ wallet, nom, couleur, type  })
          })
          .then(response => response.blob())
          .then(blob => {
            const aUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = aUrl;
            // a.download = 'pass.pkpass';
            document.body.appendChild(a);
            a.click();
            a.remove();
            }
          )
        // .then(response => response.json())
        // .then(data => console.log(data))
        .catch(error => console.error('Erreur Wallet Création :', error));
      }

    // Gestion dez cookies
        function saveFormToCookie() {
        const fields = [
            'nom', 'code', 
            'qual', 'color', 'level', 'PIXEL', 'constraste', 'standard'
        ];

        const data = {};

        fields.forEach(field => {
            const el = document.getElementById(field);
            if (el) data[field] = el.value || (el.type === 'checkbox' ? el.checked : '');
        });

        document.cookie = `walletForm=${encodeURIComponent(JSON.stringify(data))}; path=/; max-age=8640000`; // 100 jours
        }      
    // Lancer updateMap à chaque modification des champ
    window.addEventListener('DOMContentLoaded', () => {
        loadFormFromCookie();

        // Mettre la couleur au chargement
        const btColor = document.getElementById('color');
        const btFetchImg = document.getElementById('btFetchImg');
        const btGetImage = document.getElementById('btGetImage');
        // const btLaunch = document.getElementById('btLaunch');
        const btWallet = document.getElementById('btWallet');
        // btFetchImg.style.backgroundColor = btColor.value;
        // // btLaunch.style.backgroundColor = btColor.value;
        // btWallet.style.backgroundColor = btColor.value;
        // btGetImage.style.backgroundColor = btColor.value;

        // Mettre à jour dynamiquement la couleur
        // btColor.addEventListener('input', () => {
        //         btFetchImg.style.backgroundColor = btColor.value;
        //         btGetImage.style.backgroundColor = btColor.value;
        //         btWallet.style.backgroundColor = btColor.value;
        //     });
        });
    // Rechargement des cookies
    function loadFormFromCookie() {
        const cookie = document.cookie
            .split('; ')
            .find(row => row.startsWith('walletForm='));

        if (!cookie) return;

        const data = JSON.parse(decodeURIComponent(cookie.split('=')[1]));

        Object.keys(data).forEach(key => {
            const el = document.getElementById(key);
            if (el) {
            if (el.type === 'checkbox') el.checked = data[key];
            else el.value = data[key];
            }
        });
        generateUrl();
    }

    async function getVersion() {
        const res = await fetch('/api/qrcode/version');
        const vData = await res.json();
        document.getElementById('version').textContent = `© 2025 e-Coucou — v${vData.version} - ${vData.maj}`;
                console.log(vData)
    }
    getVersion();

  </script>
  </head>
  <body class="bg-bgClair dark:bg-bgDark text-txtClair dark:text-txtDark font-sans transition-colors duration-300">
    <header class="bg-bgClair dark:bg-bgDark shadow p-4 flex items-center justify-between" style="z-index: 100;width: 100%;">
      <div class="flex items-center gap-4">
        <a href="/">
          <img src="../../img/ecoucou.png" alt="eCoucou" class="h-12"/>
        </a>
        <!-- <img src="../../img/ecoucou.jpeg" alt="Logo" class="h-12" /> -->
        <h1 class="text-xl font-semibold">QR-Code</h1>
      </div>
      <button onclick="toggleDarkMode()" class="bg-SClair dark:bg-SDark text-txtClair px-4 py-1 rounded">🌓 Mode</button>
    </header>

    <main class="p-6 max-w-5xl mx-auto space-y-6 animate-fade accent-AccentClair dark:accent-Accent" style="max-height:85vh; overflow-y:auto; overflow-x: auto; -webkit-overflow-scrolling:touch;">
      <section class="text-center">
        <h2 class="text-2xl font-bold">Coupon Wallet</h2>
      </section>
      <section class="mt-8">
        <div class="grid grid-cols-12 gap-4 mb-4">
          <div class="col-span-12 md:col-span-6">
            <label class="block">Nom</label>
            <input type="text" id="nom" placeholder="My Society" onchange="generateUrl()" class="w-full px-4 py-2 rounded bg-PClair dark:bg-PDark" />
          </div>
          <div class="col-span-12 md:col-span-6">
            <label class="block">Code</label>
            <input type="text" id="code" placeholder="CodeBar" onchange="generateUrl()" class="w-full px-4 py-2 rounded bg-PClair dark:bg-PDark" />
          </div>
        </div>

<!-- <div id="mapContainer" class="hidden mt-6"> -->

          <label class="block">Design et Paramètres du QR-Code</label>
            <div class="grid grid-cols-12 gap-4 mb-4">
              <div class="col-span-12 md:col-span-2">
                <select id="type" onchange="generateUrl()" placeholder="TYPE QR/BC" class="w-full px-4 py-2 rounded bg-PClair dark:bg-PDark">
                  <option value="QR">QR-CODE</option>
                  <option value="BC">BAR-CODE</option>
                </select>
              </div>
              <div class="col-span-12 md:col-span-2">
                <select id="qual" onchange="generateUrl()" placeholder="Qualité" class="w-full px-4 py-2 rounded bg-PClair dark:bg-PDark">
                  <option value="L">L  (7%)</option>
                  <option value="M">M (15%)</option>
                  <option value="Q">Q (25%)</option>
                  <option value="H">H (30%)</option>
                </select>
              </div>
          <!-- <label class="block">Niveau de correction (LEVEL)</label> -->
              <div class="col-span-12 md:col-span-2">
                <select id="level" onchange="generateUrl()" class="w-full px-4 py-2 rounded bg-PClair dark:bg-PDark">
                    <option value="-1">-1</option>
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                </select>
            </div>
            <div class="col-span-12 md:col-span-2">
              <label class="inline-flex items-center gap-2">
                <input type="checkbox" id="contraste" onchange="generateUrl()" class="form-checkbox text-txtClair dark:text-txtDark" /> Contraste
              </label>
            </div>
            <div class="col-span-12 md:col-span-2">
              <label class="inline-flex items-center gap-2">
                <input type="checkbox" id="standard" onchange="generateUrl()" class="form-checkbox cursor-pointer" /> Standard
              </label>
            </div>
            <div class="col-span-12 md:col-span-3">
              <label class="block">Couleur</label>
              <input type="color" id="color" value="#b82b5b" onchange="generateUrl()" class="w-full h-10" />
            </div>
        </div>
        </div>

        <!-- </details> -->
        <input id="qrcodeText" type="text" readonly class="mt-4 w-full px-4 py-2 rounded bg-PClair dark:bg-PDark text-txtClair dark:text-txtDark" />
        <div class="mt-6">
          <img id="fetchedImage" class="mx-auto hidden max-w-[80vw] max-h-[80vh]" alt="QR-Code" />
        </div>
        <div class="mt-6">
          <img id="getWallet" class="mx-auto hidden max-w-[80vw] max-h-[80vh]" alt="Wallet" />
        </div>
        <div class="flex gap-2 mt-2">
          <button id="btGetImage" onclick="GetImage()" class="px-4 py-2 bg-SClair dark:bg-SDark text-txtClair rounded dark:hover:bg-PDark hover:bg-PDark"><i class="fa-duotone fa-solid fa-cloud-arrow-down"></i></button>
          <button id="btFetchImg" onclick="fetchImage()" class="px-4 py-2 bg-SClair dark:bg-SDark text-txtClair rounded dark:hover:bg-PDark hover:bg-PDark"><i class="fa-duotone fa-solid fa-qrcode"></i></button>
          <button id="btWallet" onclick="addWallet()" class="px-4 py-2 bg-SClair dark:bg-SDark text-txtClair rounded dark:hover:bg-PDark hover:bg-PDark"><i class="fa-duotone fa-solid fa-id-card"></i></button>
        </div>
      </section>
    </main>

    <footer class="text-center text-[10px] absolute bottom-4 left-1/2 -translate-x-1/2 bg-SClair dark:bg-SDark dark:text-AccentClair text-AccentClair py-0.5 rounded shadow">
      <p id="version"></p>
    </footer>
  </body>
</html>
