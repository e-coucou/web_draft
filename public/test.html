<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Barre de navigation -->
  <header class="header">
    <div class="nav-right" id="nav-right">
      <button id="loginBtn">Se connecter</button>
    </div>
  </header>

  <!-- Formulaire de connexion -->
  <div class="form-container" id="loginContainer">
    <h2>Connexion</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Mot de passe" required>
      <button type="submit">Se connecter</button>
    </form>
    <div class="links">
      <a href="/signup.html">Créer un compte</a> | 
      <a href="/newPassword.html">Mot de passe oublié</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginBtn = document.getElementById('loginBtn');
      const navRight = document.getElementById('nav-right');
      const loginContainer = document.getElementById('loginContainer');

      const token = localStorage.getItem('accessToken');
      const prenom = localStorage.getItem('prenom');

      if (token && prenom) {
        navRight.innerHTML = `
          <div class="user-info">
            <span>🦹🏼‍♂️${prenom}</span>
            <button id="logoutBtn">Déconnexion</button>
          </div>
        `;
        loginContainer.style.display = 'none';

        document.getElementById('logoutBtn').addEventListener('click', () => {
          localStorage.removeItem('accessToken');
          localStorage.removeItem('prenom');
          location.reload();
        });
      } else {
        loginBtn.addEventListener('click', () => {
          loginContainer.style.display = 'block';
        });
      }

      // Soumission du formulaire de connexion sans Axios
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
          const response = await fetch('/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, password })
          });

          const data = await response.json();

          if (response.ok && data.success) {
            localStorage.setItem('accessToken', data.accessToken);
            localStorage.setItem('prenom', data.nickname);
            location.reload();
          } else {
            alert(data.message || 'Échec de la connexion');
          }
        } catch (error) {
          alert("Erreur lors de la connexion");
        }
      });
    });
  </script>
  <style>
    .header {
      display: flex;
      justify-content: flex-end;
      padding: 10px;
      background-color: #f5f5f5;
      color: black;
    }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
    }
    #loginContainer {
      display: none;
      position: absolute;
      top: 60px;
      right: 20px;
      background-color: rgb(83, 40, 40);
      border: 1px solid #ccc;
      padding: 20px;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
      z-index: 1000;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  
  .form-container {
    background: white;
    padding: 2rem;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    width: 300px;
  }
  
  form input {
    width: 100%;
    padding: 0.8rem;
    margin: 0.5rem 0;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  
  form button {
    width: 100%;
    padding: 0.8rem;
    margin-top: 1rem;
    background-color: #007BFF;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  
  .links {
    margin-top: 1rem;
    text-align: center;
  }
  .links a {
    text-decoration: none;
    color: #007BFF;
  }
</style>

</body>
</html>
