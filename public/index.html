    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {

          .catch(err => console.error('Service Worker error ❌', err));
      });
    }

  <script>
    const toggleButton = document.getElementById('theme-toggle');
    const loginButton = document.getElementById('loginBtn');
    const token = localStorage.getItem('accessToken');
    const nickname = localStorage.getItem('nickname');

  // Gestion du theme jour/nuit
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
      toggleButton.textContent = '☀️';
    } else {
      document.documentElement.classList.remove('dark');
      toggleButton.textContent = '🌙';
    }
    toggleButton.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      if (document.documentElement.classList.contains('dark')) {
        localStorage.setItem('theme', 'dark');
        toggleButton.textContent = '☀️';
      } else {
        localStorage.setItem('theme', 'light');
        toggleButton.textContent = '🌙';
      }
    });

    // gestion du login
    const loginContainer = document.getElementById('loginContainer');
    loginBtn.addEventListener('click', async () => {
        if (loginButton.value != 'logout') {
          loginContainer.style.display = 'block';
        } else {
          loginContainer.style.display = 'none';
          localStorage.removeItem('refreshToken');
          localStorage.removeItem('accessToken');
          localStorage.removeItem('nickname');
          try {
            const response = await fetch('/logout', {
              method: 'GET',
              headers: {
                'Content-Type': 'application/json'
              },
            });
            const data = await response.json();
            if (response.ok && data.success) {
              location.reload();
            } else {
              alert(data.message || 'Échec de DéConnexion');
            }
          } catch (error) {
            alert("Erreur lors de déConnexion");
          }
      }
    });
    if (token && nickname) {
        loginContainer.style.display = 'none';

        loginButton.value = "logout";
        loginButton.innerHTML = '👤 '+localStorage.nickname + ' 🔚';
    } else {
        loginButton.innerHTML = "logIn";
    };
    // gestion du signup
    const signupButton = document.getElementById('signupBtn')
    const signupContainer = document.getElementById('signupContainer');
    signupButton.addEventListener('click', async () => {
      loginContainer.style.display = 'none';
      signupContainer.style.display = 'block';
      console.log( "création ");
      const createButton = document.getElementById('createBtn');
      createButton.addEventListener('click', async () => {
        const email = document.getElementById('email_C').value;
        const nickname = document.getElementById('nickname_C').value;
        const password = document.getElementById('password_C').value;
        const profil = 'public'; //document.getElementById('profil').value;

        console.log(email)
        const response = await fetch('/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password, profil,nickname })
        });

        const data = await response.json();

        if (data.success) {
            alert('Compte créé. Vous pouvez maintenant vous connecter.');
            window.location.href = '/';
        } else {
            alert(data.message);
        }
      });
    });

      // Soumission du formulaire de connexion
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        try {
          const response = await fetch('/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, password })
          });
          const data = await response.json();
          if (response.ok && data.success) {
            localStorage.setItem('accessToken', data.accessToken);
            localStorage.setItem('refreshToken', data.refreshToken);
            localStorage.setItem('nickname', data.nickname);
            location.reload();
          } else {
            alert(data.message || 'Échec de la connexion');
          }
        } catch (error) {
          alert("Erreur lors de la connexion");
        }
      });
    // Affichage des vignettes
