<!-- index.html -->
<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eCoucou</title>
  <meta name="theme-color" content="#10B981">
  <link rel="manifest" href="./data/manifest.json">
  <link href="/css/styleTail.css" rel="stylesheet">
  <link rel="preload" href="./data/pages.json" as="fetch" type="application/json" crossorigin="anonymous">
  <style>
    html {
      transition: background-color 0.5s, color 0.5s;
    }
    .fade-in {
      opacity: 0;
      transform: translateY(10px);
      animation: fadeIn 0.5s ease forwards;
    }
    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body class="bg-backgroundLight text-textDark dark:bg-backgroundDark dark:text-textLight">

  <button id="theme-toggle" class="fixed top-4 right-4 bg-primaryDark text-white px-4 py-2 rounded-full shadow-lg z-50">
    🌙 Mode sombre
  </button>

  <main class="min-h-screen flex flex-col justify-center items-center text-center px-4">
    <h1 class="text-4xl font-bold mb-8">Bienvenue sur eCoucou</h1>
    <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 w-full max-w-6xl"></div>
  </main>

  <footer class="mt-12 text-center text-sm text-gray-500 dark:text-gray-300 py-4">
    © 2025 eCoucou. Tous droits réservés.
  </footer>

  <script>
    const toggleButton = document.getElementById('theme-toggle');

    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
      toggleButton.textContent = '☀️ Mode clair';
    }

    toggleButton.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      if (document.documentElement.classList.contains('dark')) {
        localStorage.setItem('theme', 'dark');
        toggleButton.textContent = '☀️ Mode clair';
      } else {
        localStorage.setItem('theme', 'light');
        toggleButton.textContent = '🌙 Mode sombre';
      }
    });

    fetch('./data/pages.json', { cache: 'force-cache' })
      .then(response => response.json())
      .then(pages => {
        const gallery = document.getElementById('gallery');
        pages.forEach((page, i) => {
          gallery.innerHTML += `
            <a href="${page.link}" class="group block bg-white dark:bg-gray-800 rounded-2xl shadow-md hover:shadow-xl transition overflow-hidden fade-in" style="animation-delay:${0.1*(i+1)}s;">
              <img src="${page.image}" alt="${page.title}" class="w-full h-40 object-cover group-hover:scale-105 transition">
              <div class="p-4 text-center">
                <h2 class="font-bold text-lg">${page.title}</h2>
                <p class="text-gray-600 dark:text-gray-400 text-sm mt-1">${page.description}</p>
              </div>
            </a>`;
        });
      });
  </script>
  <script src="/service-worker.js"></script>
</body>
</html>
