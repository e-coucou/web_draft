<!-- index.html -->
<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eCoucou</title>
  <meta name="theme-color" content="#10B981">
  <link href="./css/styleTail.css" rel="stylesheet">
  <link rel="preload" href="./data/pages.json" as="fetch" type="application/json" crossorigin="anonymous">
  <meta name="description" content="eCoucou est votre portail interactif : explorez nos contenus exclusifs et découvrez une nouvelle façon de naviguer !">
  <link rel="canonical" href="https://draft.e-coucou.com/">

  <!-- Open Graph (Facebook, LinkedIn, etc.) -->
  <meta property="og:title" content="eCoucou - Bienvenue !">
  <meta property="og:description" content="Explorez des contenus exclusifs sur eCoucou, votre portail interactif.">
  <meta property="og:image" content="https://draft.e-coucou.com/images/og-image.webp">
  <meta property="og:url" content="https://draft.e-coucou.com/">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="eCoucou - Bienvenue !">
  <meta name="twitter:description" content="Explorez des contenus exclusifs sur eCoucou, votre portail interactif.">
  <meta name="twitter:image" content="https://draft.e-coucou.com/images/og-image.webp">

  <!-- Manifest PWA -->
  <link rel="manifest" href="/data/manifest.json">
  <meta name="theme-color" content="#10B981">
  <meta name="background-color" content="#F0FAF4">

  <!-- Icônes et PWA Apple -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="/favicon.ico">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="eCoucou">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Service Worker registration script -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/js/service-worker.js')
          .then(reg => console.log('Service Worker registered ✅'))
          .catch(err => console.error('Service Worker error ❌', err));
      });
    }
  </script>
  <style>
    html {
      transition: background-color 0.5s, color 0.5s;
    }
    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      animation: fadeIn 0.5s ease forwards;
    }
    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body class="bg-backgroundLight text-textDark dark:bg-backgroundDark dark:text-textLight">
    <header>
      <div class="fixed top-1 left-1 items-center gap-4 z-50">
        <a href="/">
          <img src="../../img/ecoucou.png" alt="eCoucou" class="h-12"/>
        </a>
      </div>
      <!-- <button id="theme-toggle" class="fixed top-10 right-4 bg-primaryDark text-white px-4 py-2 rounded-full shadow-lg z-50">🌙</button> -->
    </header>
<nav class="bg-white shadow-md fixed w-full z-10">
  <div class="max-w-7xl mx-auto px-4 py-2 flex justify-between items-center">
    <div class="text-xl font-bold text-blue-600"></div>
    <div class="space-x-4 dark:text-textLight text-textDark">
      <!-- <a href="#" class="hover:text-blue-500">Home</a> -->
      <a href="terms.html" class="hover:text-blue-200">About</a>
      <a href="#" class="hover:text-blue-500">Contact</a>
      <a>
      <button id="theme-toggle" class="bg-primaryDark text-white px-4 py-2 rounded-full shadow-lg z-50">🌙</button>
      </a>
    </div>
  </div>
</nav>
  <main class="min-h-screen flex flex-col justify-center items-center text-center px-4 py-20">
    <h1 class="text-4xl font-bold mb-20 animate-pulse">eCoucou</h1>
    <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 w-full max-w-6xl"></div>
  </main>

  <footer class="mt-12 bottom-8 text-center text-sm text-textDark dark:text-accent z-50">
    © 2025 eCoucou. Tous droits réservés.
  </footer>

  <script>
    const toggleButton = document.getElementById('theme-toggle');

    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
      toggleButton.textContent = '☀️';
    }

    toggleButton.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      if (document.documentElement.classList.contains('dark')) {
        localStorage.setItem('theme', 'dark');
        toggleButton.textContent = '☀️';
      } else {
        localStorage.setItem('theme', 'light');
        toggleButton.textContent = '🌙 ';
      }
    });

    fetch('./data/pages.json', { cache: 'force-cache' })
      .then(response => response.json())
      .then(pages => {
        const gallery = document.getElementById('gallery');
        pages.forEach((page, i) => {
          gallery.innerHTML += `
            <a href="${page.link}" class="group block bg-primary dark:bg-primaryDark rounded-2xl shadow-md hover:shadow-xl transition overflow-hidden fade-in" style="animation-delay:${0.1*(i+1)}s;">
              <img src="${page.image}" alt="${page.title}" class="w-full h-40 object-cover group-hover:scale-105 transition">
              <div class="p-4 text-center">
                <h2 class="font-bold text-lg">${page.title}</h2>
                <p class="text-textLight dark:text-textDark text-sm mt-1">${page.description}</p>
              </div>
            </a>`;
        });
      });
  </script>
  <script src="./js/service-worker.js"></script>
</body>
</html>
