<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page non trouvée - eCoucou</title>
  <meta name="description" content="Oups ! La page que vous recherchez semble introuvable. Retournez à l'accueil de eCoucou.">
  <!-- <link rel="stylesheet" href="/css/style.css"> -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #F0FAF4;
      color: #065F46;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 5rem;

    }

      width: 200px;

      margin-bottom: 20px;
