<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logs par jour</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="/css/styleTail.css" rel="stylesheet">
    <style>
    @media (max-width: 600px) {
    .footer-bar {
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
        }
    }
    @media (min-width: 768px) {
    .table-wrapper {
        max-height: none;
        overflow-y: visible;
        }
    }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      const currentUrl = window.location.href;
      const baseOrigin = window.location.origin;
      let adresse='';
      let fullURL;
      window.addEventListener('DOMContentLoaded', () => {
        const toggleButton = document.getElementById('theme-toggle');
        document.documentElement.classList.add('dark');
        toggleButton.textContent = '☀️';
        toggleButton.addEventListener('click', () => {
          document.documentElement.classList.toggle('dark');
          if (document.documentElement.classList.contains('dark')) {
            toggleButton.textContent = '☀️';
          } else {
            toggleButton.textContent = '🌙 ';
          }
        });
        renderChart(); // recharge le graphique
      });
    </script>
</head>
  <body class="bg-backgroundLight dark:bg-backgroundDark dark:text-textLight text-textDark font-sans transition-colors duration-300">
    <header class="bg-backgroundLight dark:bg-backgroundDark shadow p-4 flex items-center justify-between" style="z-index: 100;width: 100%;">
      <div class="flex items-center gap-4">
        <a href="/">
          <img src="../../img/ecoucou.png" alt="eCoucou" class="h-12"/>
        </a>
        <h1 class="text-xl font-semibold">QR-Code</h1>
      </div>
      <button id="theme-toggle" class="bg-primary dark:bg-primaryDark text-textLight px-4 py-1 rounded-full shadow-lg z-50">x</button>
    </header>
  <div class="p-6 rounded-2xl shadow-xl max-w-4xl mx-auto max-h-[80vh] inherit">
    <div class="flex gap-4 mb-4 inherit">
        <select id="filterType" class="border rounded p-2 bg-primary dark:bg-primaryDark inherit">
            <option value="">Tous Types</option>
        </select>
        <select id="filterOption" class="border rounded p-2 bg-primary dark:bg-primaryDark inherit">
            <option value="">Toutes Optimisations</option>
        </select>
        <div id="logCount" class="absolute bottom-2 right-4 text-sm bg-white/80 dark:bg-gray-800/80 px-3 py-1 rounded shadow">0</div>
    </div>
    <h2 class="text-2xl font-semibold mb-4">Metrics</h2>
    <canvas id="logChart" class="w-full h-64"></canvas>
  </div>

  <script>
    let rawData = [];

    function getChartColors() {
        const isDark = document.documentElement.classList.contains('dark');
        return {
            background: isDark ? bg-primaryDark : '#ffffff', // fond graphique
            // background: isDark ? '#1f2937' : '#ffffff', // fond graphique
            bg: isDark ? '#63DAC5' : '#53cAb5', // les barre
            text: isDark ? '#ffffff' : '#111827',
            grid: isDark ? '#4b5563' : '#d1d5db'
        };
    }

    async function getDataRaw() {
      const res = await fetch('/api/qrcode/metrics_raw');
      rawData = await res.json();
      getFilters();
      renderChart();
    }

    function getFilters() {
        const types = [...new Set(rawData.map(log => log.type))];
        const options = [...new Set(rawData.map(log => log.option))];

        const typeSelect = document.getElementById('filterType');
        const optionSelect = document.getElementById('filterOption');

        for (const t of types) {
            typeSelect.innerHTML += `<option value="${t}">${t}</option>`;
            }
        for (const o of options) {
            optionSelect.innerHTML += `<option value="${o}">${o}</option>`;
            }
    }

    async function renderChart() {
      const type = document.getElementById('filterType').value;
      const option = document.getElementById('filterOption').value;
      const params = new URLSearchParams({ type, option });
      const res = await fetch(`/api/qrcode/metrics_data?${params}`);
      const data = await res.json();
      
    const ctx = document.getElementById('logChart').getContext('2d');
    if (window.chart) window.chart.destroy();
    const colors = getChartColors();
    const backgroundPlugin = {
    id: 'customCanvasBackground',
        beforeDraw: (chart) => {
            const { ctx, width, height } = chart;
            ctx.save();
            ctx.fillStyle = colors.background;
            ctx.fillRect(0, 0, width, height);
            ctx.restore();
        }
    };
      window.chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: Object.keys(data),
          datasets: [{
            label: 'Logs',
            data: Object.values(data),
            backgroundColor: colors.bg
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { labels: { color: colors.text } },
          },
          scales: {
            x: { title: { display: true, text: 'Date' },
                 ticks: { color: colors.text },
                 grid: { color: colors.grid }
                },
            y: { beginAtZero: true, title: { display: true, text: 'Occurrences' },
                 ticks: {color: colors.text},
                 grid: {color: colors.grid}
                }
          }
        },
        plugins: [backgroundPlugin]
      });
      // Mettre à jour le compteur
      const total = Object.values(data).reduce((sum, val) => sum + val, 0);
      document.getElementById('logCount').textContent = `records: ${total}`;
    }
    
    document.getElementById('filterType').addEventListener('change', renderChart);
    document.getElementById('filterOption').addEventListener('change', renderChart);
    getDataRaw();
    // Get version
    async function getVersion() {
        const res = await fetch('/api/qrcode/version');
        const vData = await res.json();
        document.getElementById('version').textContent = `© 2025 e-Coucou — v${vData.version} - ${vData.maj}`;
                console.log(vData)
    }
    getVersion();

  </script>
    <footer class="text-center text-[10px] absolute bottom-4 left-1/2 -translate-x-1/2 bg-primary dark:bg-primaryDark dark:text-AccentClair text-AccentClair py-0.5 rounded shadow">
      <p id="version"></p>
    </footer>
</body>
</html>
